# Zigbee2MQTT for the SeQ hub: /var/lib/zigbee2mqtt/configuration.yaml
# Written for Zigbee2MQTT 2.x and the Sonoff ZBDongle-E, and run as it is with
# Zigbee2MQTT 2.14.2 on Node.js 24 (trial on real hardware, 24 October 2026; see
# docs/systeme.md, step 8, and docs/adapter-zigbee.md).
mqtt:
  server: mqtt://127.0.0.1:1883
  base_topic: zigbee2mqtt   # must match base_topic in /etc/safehome/zigbee.json
  client_id: zigbee2mqtt
# The ZBDongle-E shows as USB 10c4:ea60 "Sonoff Zigbee 3.0 USB Dongle Plus V2"; its
# firmware on the trial: EmberZNet 7.4.4 (EZSP 13), at 115200 bauds without hardware
# flow control.
serial:
  port: /dev/serial/by-id/CHANGE-ME   # the stick, by its stable name (ls /dev/serial/by-id)
  adapter: ember                       # ZBDongle-E (EFR32); "zstack" for a ZBDongle-P
  baudrate: 115200
  rtscts: false
advanced:
  network_key: GENERATE   # created at the first start, then saved: back it up (docs/systeme.md)
  pan_id: GENERATE
  ext_pan_id: GENERATE
  log_level: warning
  log_output:
    - console              # to the journal, kept in memory
  # Every device message says when the device was heard: a key pressed while
  # safehome-zigbee was down reaches the hub with its real age and expires
  # (docs/adapter-zigbee.md, "QoS"), instead of disarming the shop when the adapter
  # comes back.
  last_seen: ISO_8601
# The devices' messages go out at QoS 1: safehome-zigbee keeps a persistent session,
# so the broker queues them while the adapter restarts instead of dropping them (a
# door that opened meanwhile). They are not retained: the adapter saves the states
# itself, a retained message replayed is never an event anyway (docs/adapter-zigbee.md,
# "Messages retenus"), and it would only add writes to the broker's store.
# Except the keypads: their messages carry the access code, which the broker must
# never keep. safehome-zigbee gives each one the device option qos: 0 through
# bridge/request/device/options, and Zigbee2MQTT writes it in a devices: section
# here (docs/adapter-zigbee.md, "Clavier : QoS 0"): leave it there.
device_options:
  qos: 1
  retain: false
# Our adapter watches presence itself and decides about pairing: Zigbee2MQTT's own
# availability feature and web interface stay off (less memory, nothing exposed).
availability:
  enabled: false
frontend:
  enabled: false
homeassistant:
  enabled: false
