# Drop-in for systemd-timesyncd (docs/systeme.md): it sets the clock forward, early at
# boot, to the date of /var/lib/systemd/timesync/clock, which is kept on the data
# partition (fstab-data). Started after that bind, hence after /data: a bind mount comes
# after the mount of its source.
#
# No cycle: these mounts come after local-fs-pre.target and the device only, never after
# sysinit.target, which timesyncd comes before; safehome-boot-clock.service still comes
# after timesyncd. WantsMountsFor (systemd 256 or later) rather than RequiresMountsFor:
# this line adds no failure. StateDirectory= may already require the mount (implicit
# dependencies, systemd.exec(5)): then a failed bind keeps timesyncd from starting, so
# install.sh makes the folder before it writes the line.
[Unit]
WantsMountsFor=/var/lib/systemd/timesync
