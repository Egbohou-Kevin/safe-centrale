# Mosquitto for the safeHome hub: replaces /etc/mosquitto/mosquitto.conf entirely.
# Only the programs of the hub talk to it: it listens on the hub itself, never on the
# shop's network. Nobody else on the Wi-Fi can send an order to the alarm.
pid_file /run/mosquitto/mosquitto.pid
listener 1883 127.0.0.1
allow_anonymous true

# Retained messages (device states, alarm state, health) and queued QoS 1 messages
# survive a restart. The folder is on the writable partition; saving every 5 minutes
# rather than at each message spares the SD card. After an unclean stop (a power cut,
# a watchdog reboot) the retained device states are those of the last save, up to 5
# minutes old: the alarm engine keeps when it last heard each sensor, and sets aside at
# boot a state older than that (docs/engine.md, "Persistance et redémarrage").
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 300

# The messages that carry the access code (an order from the app on alarm/cmd, a
# keypad's key sequence on device/+/event) are published at QoS 0: the broker keeps
# none of them for a program away (a restart), neither in memory nor in its file on the
# SD card. That holds only while QoS 0 messages are queued for no one, Mosquitto's
# default, written here so that nobody changes it unaware (docs/systeme.md).
queue_qos0_messages false

# Logs go to the journal, kept in memory.
log_dest syslog
log_type error
log_type warning
log_type notice
