# Mosquitto for the safeHome hub: replaces /etc/mosquitto/mosquitto.conf entirely.
# Only the programs of the hub talk to it: it listens on the hub itself, never on the
# shop's network. Nobody else on the Wi-Fi can send an order to the alarm.
pid_file /run/mosquitto/mosquitto.pid
listener 1883 127.0.0.1
allow_anonymous true

# Retained messages (device states, alarm state, health) and queued QoS 1 messages
# survive a restart. The folder is on the writable partition; saving every 5 minutes
# rather than at each message spares the SD card (our programs keep their own state).
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 300

# Logs go to the journal, kept in memory.
log_dest syslog
log_type error
log_type warning
log_type notice
